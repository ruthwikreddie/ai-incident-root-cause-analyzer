services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password

    ports:
      - "5432:5432"

    volumes:
      - incident_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: incident-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6379:6379"

    volumes:
      - incident_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  incident_postgres_data:
  incident_redis_data:
